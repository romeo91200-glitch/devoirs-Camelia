    window.DEVOIRS = [
      {
        titre: "📝 Pour le jeudi 5/11",

          <li>Lecture : relire <b>p 24</b> du manuel Alfi</li>
          <li>Calcul : <mark>Evaluation</mark> revoir C1-2-3-8</li>

      },
      {
        titre: "🔢 Calcul mental B1 (liste B, période 2)",

          { q: "4 + 5", vrai: false },
          { q: "1 + 9", vrai: true },
          { q: "5 + 3", vrai: false },
          { q: "3 + 7", vrai: true },
