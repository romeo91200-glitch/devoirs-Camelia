<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#ff6fa8">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="icon" href="../../icons/icon-192.png">
  <title>Devoirs du 30 novembre</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <a class="retour" href="../../">⬅ Retour aux dossiers</a>
  <header class="entete">
    <h1>Lundi 30 novembre</h1>
    <p>Appuie sur 🔊 pour écouter. C'est parti !</p>
  </header>

  <nav class="onglets">
    <button type="button" data-onglet="devoirs" class="actif">📋 Les devoirs</button>
    <button type="button" data-onglet="entrainement">🎮 Entraînement</button>
  </nav>
  <main id="devoirs" class="exercices"></main>
  <main id="exercices" class="exercices" hidden></main>
  <div id="score" class="score" hidden></div>

  <script src="../../assets/lecons.js"></script>
  <script>
    // Dessin « dizaines et unités » : barres vertes (dizaines) + petits carrés (unités).
    const dessin = (d, u) => `<span style="display:inline-flex;align-items:center;gap:6px;border:2px solid #bbb;border-radius:8px;padding:8px 14px;background:#fff">`
      + `<span style="display:inline-flex;gap:6px">${'<span style="display:inline-block;width:10px;height:60px;background:#2e7d32;border-radius:2px"></span>'.repeat(d)}</span>`
      + `<span style="display:inline-grid;grid-template-columns:repeat(2,12px);gap:4px;margin-left:14px">${'<span style="width:12px;height:12px;background:#d9b26f;border-radius:2px"></span>'.repeat(u)}</span></span>`;

    const alfi = {
      1: "Le repas fini, Alfi et Dina filent à la tour de Paris. Les amis louent des vélos. Dina chute. Alfi lui passe alors de la pommade.",
      2: "Le repas fini, Alfi a une idée : une sortie à la tour de Paris. Les amis louent des vélos. Dina ne touche pas les pédales. Elle chute sur le dos. Alfi la relève. Il lui passe de la pommade. Les amis repartent sur le vélo d'Alfi et arrivent à la tour.",
      3: "Le repas fini, Alfi a une idée : une sortie à la tour de Paris. Les amis louent des vélos. Dina est petite, elle ne touche pas les pédales. Elle chute sur le dos. Alfi la relève. Il lui passe de la pommade. Les amis repartent sur le vélo d'Alfi et arrivent vite à la tour. La tour est énorme. Dina est épatée. Dina et Alfi adorent Paris !",
    };

    // Les devoirs tels qu'ils sont sur les photos (recopiés à l'identique).
    window.DEVOIRS = [
      {
        titre: "📝 Pour le lundi 30 novembre",
        html: `<ul>
          <li>Calcul mental (pochette) : <b>D4</b></li>
          <li>Lecture : relire <b>p 37</b> du manuel Alfi</li>
          <li>Orthographe/encodage : <b>dictée D</b> à préparer + leçon <b>O1</b> ⇒ revoir les listes <b>1 à 8</b> + apprendre liste <b>9</b></li>
          <li>Calcul : leçon <b>C4 (doubles jusqu'à 5) et C5 (moitiés jusqu'à 10)</b></li>
        </ul>
        <p class="rappel">Signer les divers cahiers/fichiers</p>`,
      },
      {
        titre: "🔢 Calcul mental D4 (période 2)",
        html: `<p><i>Les calculs se font de tête à l'oral (sans limite de temps mais en essayant d'être le plus rapide possible). Ne faites pas les listes en avance, l'entraînement doit être régulier et il suit une progression de travail en classe.</i></p>
          <p>Thème 4 : Connaissance des nombres jusqu'à 49 – Doubles et moitiés</p>
          <p><b>Liste D :</b></p>
          <p class="gros">Combien d'unités ?<br>De dizaines ?<br>C'est quel nombre ?</p>
          <p>${dessin(3, 4)} &nbsp; ${dessin(3, 8)}</p>`,
      },
      {
        titre: "📖 Lecture : manuel Alfi p 37 « La tour de Paris »",
        html: `<p class="titre-lecon"><u>La tour de Paris</u></p>
          <p>🥚</p><p class="gros">${alfi[1]}</p>
          <p>🥚🥚</p><p class="gros">${alfi[2]}</p>
          <p>🥚🥚🥚</p><p class="gros">${alfi[3]}</p>`,
      },
      {
        titre: "✏️ Dictée D (dictées période 2)",
        html: `<p><i>Le groupe 🥚 apprend la première colonne + la colonne mots outils.<br>
          Le groupe 🥚🥚 apprend la première colonne + la deuxième colonne + la colonne mots outils.<br>
          Le groupe 🥚🥚🥚 apprend la deuxième + la troisième colonne + la colonne mots outils.</i></p>
          <table class="tableau"><tr><td>🥚</td><td class="cursive gros">da - di - de - dou</td></tr>
          <tr><td>+ 🥚🥚</td><td class="cursive gros">la date - solide</td></tr>
          <tr><td>+ 🥚🥚🥚</td><td class="cursive gros"><span style="color:#d03030">des</span> sardines<br>Il <span style="color:#d03030">est</span> malade.</td></tr>
          <tr><td>Mots outils</td><td class="cursive gros" style="color:#d03030">nous<br>vous</td></tr></table>`,
      },
      { titre: "🔤 Mots outils : leçon O1 (listes 1 à 8 + liste 9)", html: window.LECONS.O1(9) },
      { titre: "➕ Calcul : leçon C4", html: window.LECONS.C4 },
      { titre: "➗ Calcul : leçon C5", html: window.LECONS.C5 },
    ];

    window.EXERCICES = [
      // Calcul mental D4
      {
        type: "trous",
        titre: "🟩 Calcul mental D4 : dessin 1",
        consigne: `Compte les barres (dizaines) et les petits carrés (unités).<br>${dessin(3, 4)}`,
        phrases: ["Il y a [3] dizaines.", "Il y a [4] unités.", "C'est le nombre [34]."],
      },
      {
        type: "trous",
        titre: "🟩 Calcul mental D4 : dessin 2",
        consigne: `Compte les barres (dizaines) et les petits carrés (unités).<br>${dessin(3, 8)}`,
        phrases: ["Il y a [3] dizaines.", "Il y a [8] unités.", "C'est le nombre [38]."],
      },
      {
        type: "qcm",
        titre: "🎯 Encore des dizaines et des unités",
        consigne: "Quel nombre est dessiné ?",
        questions: [
          { q: dessin(2, 5), choix: ["25", "52", "7"], bonne: 0 },
          { q: dessin(4, 1), choix: ["14", "41", "40"], bonne: 1 },
          { q: dessin(1, 6), choix: ["16", "61", "7"], bonne: 0 },
          { q: dessin(4, 7), choix: ["47", "74", "11"], bonne: 0 },
        ],
      },

      // Lecture p 37
      { type: "histoire", titre: "📖 Écoute l'histoire (🥚)", texte: "La tour de Paris. " + alfi[1] },
      { type: "histoire", titre: "📖 Écoute l'histoire (🥚🥚)", texte: "La tour de Paris. " + alfi[2] },
      { type: "histoire", titre: "📖 Écoute l'histoire (🥚🥚🥚)", texte: "La tour de Paris. " + alfi[3] },
      {
        type: "qcm",
        titre: "🗼 As-tu bien compris ?",
        consigne: "Relis l'histoire et choisis la bonne réponse.",
        questions: [
          { q: "Où vont Alfi et Dina ?", choix: ["à la plage", "à la tour de Paris", "à l'école"], bonne: 1 },
          { q: "Que louent les amis ?", choix: ["des vélos", "des rollers", "une voiture"], bonne: 0 },
          { q: "Qui chute ?", choix: ["Alfi", "Matéo", "Dina"], bonne: 2 },
          { q: "Que passe Alfi à Dina ?", choix: ["de la pommade", "un gâteau", "un ballon"], bonne: 0 },
          { q: "Pourquoi Dina ne touche pas les pédales ?", choix: ["Elle est petite", "Elle a peur", "Elle dort"], bonne: 0 },
        ],
      },
      {
        type: "vraifaux",
        titre: "✅ Vrai ou faux ?",
        consigne: "Réfléchis bien !",
        questions: [
          { q: "Dina chute sur le dos.", vrai: true },
          { q: "Les amis repartent sur le vélo de Dina.", vrai: false },
          { q: "La tour est toute petite.", vrai: false },
          { q: "Dina et Alfi adorent Paris.", vrai: true },
        ],
      },

      // Dictée D
      {
        type: "qcm",
        titre: "👂 J'écoute la syllabe",
        consigne: "Appuie sur 🔊 et choisis la syllabe que tu entends.",
        questions: [
          { q: "Syllabe 1", dire: "da", choix: ["di", "da", "do"], bonne: 1 },
          { q: "Syllabe 2", dire: "dou", choix: ["dou", "de", "bou"], bonne: 0 },
          { q: "Syllabe 3", dire: "di", choix: ["bi", "da", "di"], bonne: 2 },
          { q: "Syllabe 4", dire: "de", choix: ["de", "dé", "be"], bonne: 0 },
        ],
      },
      {
        type: "dictee",
        titre: "✏️ Dictée D : je m'entraîne",
        consigne: "Appuie sur 🔊 et écris ce que tu entends. Fais seulement les lignes de ton groupe !",
        mots: [
          { dire: "da", ecrire: "da" }, { dire: "di", ecrire: "di" }, { dire: "de", ecrire: "de" }, { dire: "dou", ecrire: "dou" },
          { dire: "nous", ecrire: "nous" }, { dire: "vous", ecrire: "vous" },
          { dire: "la date", ecrire: "la date" }, { dire: "solide", ecrire: "solide" },
          { dire: "des sardines", ecrire: "des sardines" }, { dire: "Il est malade.", ecrire: "Il est malade." },
        ],
      },

      // Mots outils O1
      {
        type: "qcm",
        titre: "🔤 Le mot outil (O1, liste 9)",
        consigne: "Appuie sur 🔊 et trouve le mot que tu entends.",
        questions: [
          { q: "Mot 1", dire: "nous", choix: ["vous", "nous", "mais"], bonne: 1 },
          { q: "Mot 2", dire: "vous", choix: ["vous", "nous", "avec"], bonne: 0 },
          { q: "Mot 3", dire: "Nous allons à Paris.", choix: ["nous", "vous", "dans"], bonne: 0 },
          { q: "Mot 4", dire: "Vous louez des vélos.", choix: ["nous", "les", "vous"], bonne: 2 },
        ],
      },
      {
        type: "qcm",
        titre: "🔁 Je révise les listes 1 à 8",
        consigne: "Appuie sur 🔊 et trouve le mot que tu entends, le plus vite possible !",
        questions: [
          { q: "Mot 1", dire: "une", choix: ["un", "une", "elle"], bonne: 1 },
          { q: "Mot 2", dire: "il y a", choix: ["il y a", "c'est", "est"], bonne: 0 },
          { q: "Mot 3", dire: "et, comme papa et maman", choix: ["est", "et", "elle"], bonne: 1 },
          { q: "Mot 4", dire: "est, comme il est petit", choix: ["et", "les", "est"], bonne: 2 },
          { q: "Mot 5", dire: "dans", choix: ["des", "dans", "nous"], bonne: 1 },
          { q: "Mot 6", dire: "c'est", choix: ["c'est", "elle", "est"], bonne: 0 },
          { q: "Mot 7", dire: "elle", choix: ["les", "une", "elle"], bonne: 2 },
          { q: "Mot 8", dire: "des", choix: ["des", "les", "dans"], bonne: 0 },
        ],
      },
      {
        type: "dictee",
        titre: "✏️ Petite dictée de mots outils",
        consigne: "Appuie sur 🔊 et écris le mot. Tu peux vérifier dans la leçon O1 après !",
        mots: [
          { dire: "nous", ecrire: "nous" }, { dire: "vous", ecrire: "vous" },
          { dire: "un", ecrire: "un" }, { dire: "dans", ecrire: "dans" },
          { dire: "elle", ecrire: "elle" }, { dire: "c'est", ecrire: "c'est|c’est" },
          { dire: "les", ecrire: "les" }, { dire: "il y a", ecrire: "il y a" },
        ],
      },

      // C4 doubles jusqu'à 5
      {
        type: "trous",
        titre: "➕ Les doubles jusqu'à 5 (C4)",
        consigne: "Le double, c'est quand on ajoute deux fois le même nombre.",
        phrases: ["1 + 1 = [2]", "2 + 2 = [4]", "3 + 3 = [6]", "4 + 4 = [8]", "5 + 5 = [10]"],
      },
      {
        type: "qcm",
        titre: "🎲 Quel est le double ?",
        consigne: "Compte les points des deux dés.",
        questions: [
          { q: "Le double de 3 : ⚂ ⚂", choix: ["5", "6", "9"], bonne: 1 },
          { q: "Le double de 5 : ⚄ ⚄", choix: ["10", "5", "11"], bonne: 0 },
          { q: "Le double de 2 : ⚁ ⚁", choix: ["3", "2", "4"], bonne: 2 },
          { q: "Le double de 4 : ⚃ ⚃", choix: ["8", "6", "44"], bonne: 0 },
          { q: "Le double de 1 : ⚀ ⚀", choix: ["1", "2", "11"], bonne: 1 },
        ],
      },

      // C5 moitiés jusqu'à 10
      {
        type: "trous",
        titre: "➗ Les moitiés jusqu'à 10 (C5)",
        consigne: "Pense aux doubles : 4 + 4 = 8, donc la moitié de 8, c'est 4.",
        phrases: ["La moitié de 2, c'est [1].", "La moitié de 4, c'est [2].", "La moitié de 6, c'est [3].", "La moitié de 8, c'est [4].", "La moitié de 10, c'est [5]."],
      },
      {
        type: "qcm",
        titre: "🍬 Partage en 2 parts égales",
        consigne: "Tu partages avec ton amie : chacune en a autant. Combien en a chacune ?",
        questions: [
          { q: "🍬🍬🍬🍬🍬🍬", choix: ["2", "3", "4"], bonne: 1 },
          { q: "🍓🍓🍓🍓🍓🍓🍓🍓🍓🍓", choix: ["5", "10", "4"], bonne: 0 },
          { q: "🕯️🕯️🕯️🕯️🕯️🕯️🕯️🕯️", choix: ["2", "6", "4"], bonne: 2 },
          { q: "🍪🍪🍪🍪", choix: ["2", "1", "3"], bonne: 0 },
        ],
      },
      {
        type: "vraifaux",
        titre: "🤔 Double ou moitié : vrai ou faux ?",
        consigne: "Réfléchis bien !",
        questions: [
          { q: "Le double de 4, c'est 8.", vrai: true },
          { q: "La moitié de 10, c'est 2.", vrai: false },
          { q: "3 + 3 = 6, donc la moitié de 6, c'est 3.", vrai: true },
          { q: "Le double de 5, c'est 15.", vrai: false },
        ],
      },
    ];
  </script>
  <script src="../../assets/exercices.js"></script>
  <script src="../../assets/brouillon.js"></script>
</body>
</html>
